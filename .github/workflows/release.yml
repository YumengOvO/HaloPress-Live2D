name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check live2d-widget/widget.js
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build WordPress plugin archive
        run: |
          mkdir -p release/halopress-live2d
          cp -R assets includes live2d-widget release/halopress-live2d/
          cp halopress-live2d.php uninstall.php LICENSE README.md readme.txt THIRD-PARTY-NOTICES.md release/halopress-live2d/
          cd release
          zip -r halopress-live2d.zip halopress-live2d
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/halopress-live2d.zip --generate-notes --title "HaloPress-Live2D ${GITHUB_REF_NAME}"

